      function calculateQuizResult(answers) {
        const scores = { PM: 0, DEV: 0, DESIGN: 0, DATA: 0 };
        answers.forEach((role) => {
          scores[role] += 1;
        });

        const maxScore = Math.max(...Object.values(scores));
        const tiedRoles = Object.keys(scores).filter((r) => scores[r] === maxScore);
        let winner = tiedRoles[0];

        if (tiedRoles.length > 1) {
          const h2h = { PM: 0, DEV: 0, DESIGN: 0, DATA: 0 };
          QUIZ_QUESTIONS.forEach((q, idx) => {
            const picked = answers[idx];
            const [optA, optB] = q.options;
            if (tiedRoles.includes(optA.role) && tiedRoles.includes(optB.role) && picked) {
              h2h[picked] += 1;
            }
          });
          const maxH2H = Math.max(...tiedRoles.map((r) => h2h[r]));
          const h2hWinners = tiedRoles.filter((r) => h2h[r] === maxH2H);
          if (h2hWinners.length === 1) {
            winner = h2hWinners[0];
          } else {
            for (let i = answers.length - 1; i >= 0; i -= 1) {
              if (h2hWinners.includes(answers[i])) {
                winner = answers[i];
                break;
              }
            }
          }
        }

        const total = Math.max(answers.length, 1);
        const rankedRoles = Object.keys(scores)
          .map((key) => ({
            role: ROLE_RESULTS[key],
            count: scores[key],
            percentage: Math.round((scores[key] / total) * 100),
          }))
          .sort((a, b) => {
            if (b.count !== a.count) return b.count - a.count;
            if (a.role.type === winner) return -1;
            if (b.role.type === winner) return 1;
            return 0;
          });

        return {
          primaryRole: ROLE_RESULTS[winner],
          rankedRoles,
        };
      }

            <section class="rounded-3xl bg-white border border-sky-100 shadow-md shadow-sky-500/5 p-6 sm:p-8">
              <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1 mb-5">
                <h2 class="text-lg font-bold text-slate-900">테스트로 만날 수 있는 4가지 일하는 스타일</h2>
                <span class="text-sm text-slate-500">기획 · 개발 · 디자인 · 데이터</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
                ${roleOrder
                  .map((key, idx) => {
                    const role = ROLE_RESULTS[key];
                    return `
                      <div class="flex items-start gap-3.5 ${idx > 0 ? 'pt-3.5 sm:pt-0 border-t sm:border-t-0 border-sky-100' : ''}">
                        <div class="w-11 h-11 rounded-xl overflow-hidden border border-sky-100 shrink-0 mt-0.5">
                          ${getIllustrationSvg(role.type)}
                        </div>
                        <div class="min-w-0">
                          <p class="text-base font-bold text-slate-900">${role.name}</p>
                          <p class="text-sm text-slate-600 mt-0.5 leading-snug">${role.nickname}</p>
                        </div>
                      </div>
                    `;
                  })
                  .join('')}
              </div>
            </section>
          </div>
        `;

        document.getElementById('start-quiz-btn').addEventListener('click', () => {
          state.phase = 'quiz';
          state.currentIndex = 0;
          state.answers = Array(QUIZ_QUESTIONS.length).fill(null);
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      function renderQuizScreen() {
        const q = QUIZ_QUESTIONS[state.currentIndex];
        const total = QUIZ_QUESTIONS.length;
        const pct = ((state.currentIndex + 1) / total) * 100;
        const prevRole = state.answers[state.currentIndex];

        mainEl.innerHTML = `
          <div class="w-full max-w-3xl mx-auto space-y-4 sm:space-y-6">
            <div class="rounded-3xl bg-white border border-sky-100 shadow-md shadow-sky-500/5 px-5 py-4 sm:px-7 sm:py-5">
              <div class="flex items-center justify-between gap-4 mb-3">
                <div class="flex items-center gap-2">
                  ${
                    state.currentIndex > 0
                      ? `<button id="prev-q-btn" type="button" class="min-h-[48px] -ml-2 px-3 rounded-xl inline-flex items-center gap-1.5 text-[15px] font-semibold text-slate-700 hover:text-sky-700 hover:bg-sky-50 active:bg-sky-100 cursor-pointer">
                          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                          <span>이전 질문</span>
                        </button>`
                      : `<span class="min-h-[48px] inline-flex items-center text-[15px] font-semibold text-sky-700">대학생활 스타일 체크</span>`
                  }
                </div>
                <div class="text-base sm:text-lg font-bold text-sky-700 tabular-nums shrink-0 font-display">
                  ${state.currentIndex + 1} / ${total}
                </div>
              </div>
              <div class="w-full h-3.5 rounded-full bg-sky-100 overflow-hidden">
                <div class="h-full rounded-full bg-gradient-to-r from-sky-400 to-sky-600 transition-all duration-300" style="width: ${pct}%"></div>
              </div>
            </div>

            <section class="rounded-3xl bg-white border border-sky-100 shadow-lg shadow-sky-500/10 p-6 sm:p-9 lg:p-10 animate-fade-in">
              <div class="space-y-3 mb-6 sm:mb-8">
                <p class="text-sm sm:text-[15px] font-semibold text-sky-600">Q${q.id}. ${q.context}</p>
                <h2 class="text-[21px] sm:text-2xl lg:text-[26px] font-bold text-slate-900 leading-[1.45]">${q.question}</h2>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
                ${q.options
                  .map((opt) => {
                    const isPicked = prevRole === opt.role;
                    return `
                      <button
                        type="button"
                        data-option-id="${opt.id}"
                        data-role="${opt.role}"
                        class="choice-btn group relative text-left rounded-3xl p-6 sm:p-7 min-h-[144px] sm:min-h-[168px] flex flex-col justify-between gap-4 border-2 transition-colors cursor-pointer ${
                          isPicked
                            ? 'bg-sky-50 border-sky-500 shadow-md shadow-sky-500/20'
                            : 'bg-sky-50/45 hover:bg-sky-50 active:bg-sky-100/70 border-sky-100 hover:border-sky-300'
                        }"
                      >
                        <div class="flex items-center justify-between w-full">
                          <span class="option-badge w-10 h-10 rounded-2xl text-base font-bold flex items-center justify-center font-display ${
                            isPicked
                              ? 'bg-sky-600 text-white'
                              : 'bg-white text-sky-700 border border-sky-200 group-hover:border-sky-400'
                          }">${opt.id}</span>
                          <span class="check-dot w-8 h-8 rounded-full bg-sky-600 text-white flex items-center justify-center ${
                            isPicked ? '' : 'hidden'
                          }">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                          </span>
                        </div>
                        <p class="text-[17px] sm:text-lg font-semibold text-slate-800 leading-[1.55]">${opt.label}</p>
                      </button>
                    `;
                  })
                  .join('')}
              </div>
            </section>
          </div>
        `;

        const prevBtn = document.getElementById('prev-q-btn');
        if (prevBtn) {
          prevBtn.addEventListener('click', () => {
            if (state.isTransitioning || state.currentIndex === 0) return;
            state.currentIndex -= 1;
            render();
          });
        }

        document.querySelectorAll('.choice-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.isTransitioning) return;
            state.isTransitioning = true;

            const chosenRole = btn.dataset.role;
            btn.classList.add('animate-choice-pop', 'bg-sky-50', 'border-sky-500');
            btn.querySelector('.option-badge').className =
              'option-badge w-10 h-10 rounded-2xl text-base font-bold flex items-center justify-center font-display bg-sky-600 text-white';
            btn.querySelector('.check-dot').classList.remove('hidden');

            setTimeout(() => {
              state.answers[state.currentIndex] = chosenRole;
              state.isTransitioning = false;
              if (state.currentIndex + 1 < QUIZ_QUESTIONS.length) {
                state.currentIndex += 1;
              } else {
                state.phase = 'result';
                window.scrollTo({ top: 0, behavior: 'smooth' });
              }
              render();
            }, 300);
          });
        });
      }

      function renderResultScreen() {
        const { primaryRole, rankedRoles } = calculateQuizResult(state.answers);
        const { theme } = primaryRole;

        wrapperEl.className = `min-h-dvh flex flex-col text-slate-900 transition-colors duration-500 ${theme.pageBg}`;

        mainEl.innerHTML = `
          <div class="w-full max-w-5xl mx-auto space-y-5 sm:space-y-6 animate-fade-in">
            <div id="capture-area" class="space-y-5 sm:space-y-6 rounded-3xl p-1 sm:p-2 -m-1 sm:-m-2">
              <section class="rounded-3xl ${theme.heroCardBg} border ${theme.heroBorder} shadow-lg shadow-slate-900/5 overflow-hidden">
                <div class="grid grid-cols-1 lg:grid-cols-12 items-stretch">
                  <div class="lg:col-span-5 ${theme.illustrationBg} border-b lg:border-b-0 lg:border-r ${theme.heroBorder} p-5 sm:p-7 flex items-center justify-center">
                    <div class="w-full max-w-[300px] lg:max-w-none aspect-square rounded-2xl overflow-hidden bg-white/70 shadow-sm">
                      ${getIllustrationSvg(primaryRole.type)}
                    </div>
                  </div>
                  <div class="lg:col-span-7 p-6 sm:p-9 lg:p-11 flex flex-col justify-between gap-7">
                    <div class="space-y-4">
                      <p class="text-sm sm:text-base font-bold ${theme.accentText}">
                        12개 질문 분석 결과 · 나와 가장 잘 맞는 직무
                      </p>
                      <div class="space-y-2.5">
                        <h1 class="text-[36px] sm:text-5xl lg:text-[52px] font-extrabold tracking-tight text-slate-900 leading-[1.15]">
                          ${primaryRole.name}
                        </h1>
                        <p class="text-xl sm:text-2xl font-bold ${theme.accentText}">
                          “${primaryRole.nickname}”
                        </p>
                      </div>
                      <div class="pt-2 space-y-3 text-base sm:text-[17px] text-slate-700 leading-[1.7]">
                        ${primaryRole.description.map((p) => `<p>${p}</p>`).join('')}
                      </div>
                    </div>

                    <div data-capture-ignore="true" class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-center gap-3 pt-2">
                      <button
                        id="download-png-btn"
                        type="button"
                        class="w-full sm:w-auto min-h-[58px] px-6 py-4 rounded-2xl font-bold text-[17px] inline-flex items-center justify-center gap-2.5 cursor-pointer transition-all whitespace-nowrap ${theme.primaryBtn}"
                      >
                        <span>PNG 이미지 저장</span>
                      </button>
                      <button
                        id="share-copy-btn"
                        type="button"
                        class="w-full sm:w-auto min-h-[58px] px-6 py-4 rounded-2xl border font-bold text-[17px] inline-flex items-center justify-center gap-2.5 cursor-pointer transition-all whitespace-nowrap ${theme.secondaryBtn}"
                      >
                        <span>공유하기</span>
                      </button>
                      <button
                        id="result-restart-btn"
                        type="button"
                        class="w-full sm:w-auto min-h-[58px] px-6 py-4 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-bold text-[17px] inline-flex items-center justify-center gap-2 cursor-pointer transition-all whitespace-nowrap"
                      >
                        <span>다시하기</span>
                      </button>
                    </div>
                  </div>
                </div>
              </section>

              <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 sm:gap-6 items-stretch">
                <section class="lg:col-span-7 rounded-3xl bg-white border ${theme.heroBorder} shadow-md shadow-slate-900/5 p-6 sm:p-8">
                  <div class="flex flex-wrap items-baseline justify-between gap-2 mb-5">
                    <h2 class="text-xl font-bold text-slate-900">미리 준비하면 좋은 자격증 · 과목 3가지</h2>
                    <span class="text-sm font-medium text-slate-500">학부생 추천</span>
                  </div>
                  <ol class="divide-y ${theme.divider}">
                    ${primaryRole.preparations
                      .map(
                        (item, idx) => `
                        <li class="py-4 sm:py-5 first:pt-1 last:pb-1 flex items-start gap-4">
                          <span class="w-9 h-9 rounded-xl ${theme.badgeBg} ${theme.badgeText} font-bold text-base flex items-center justify-center shrink-0 mt-0.5 tabular-nums font-display">0${idx + 1}</span>
                          <div class="min-w-0 flex-1 space-y-1.5">
                            <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5">
                              <h3 class="text-[17px] sm:text-lg font-bold text-slate-900">${item.title}</h3>
                              <span class="text-sm font-semibold ${theme.accentText}">· ${item.category}</span>
                            </div>
                            <p class="text-[15px] sm:text-base text-slate-600 leading-relaxed">${item.reason}</p>
                          </div>
                        </li>
                      `
                      )
                      .join('')}
                  </ol>
                </section>

                <section class="lg:col-span-5 rounded-3xl bg-white border ${theme.heroBorder} shadow-md shadow-slate-900/5 p-6 sm:p-8 flex flex-col justify-between gap-6">
                  <div>
                    <div class="flex items-baseline justify-between gap-2 mb-5">
                      <h2 class="text-xl font-bold text-slate-900">나의 직무 성향 분포</h2>
                      <span class="text-sm font-medium text-slate-500 tabular-nums">총 12문항 기준</span>
                    </div>
                    <div class="space-y-4">
                      ${rankedRoles
                        .map(
                          (entry, idx) => `
                          <div class="space-y-2">
                            <div class="flex items-center justify-between text-[15px] sm:text-base">
                              <span class="${idx === 0 ? `font-bold ${theme.accentText}` : 'font-semibold text-slate-700'}">${entry.role.name}</span>
                              <span class="text-slate-600 tabular-nums font-semibold">${entry.count}개 (${entry.percentage}%)</span>
                            </div>
                            <div class="w-full h-3 rounded-full ${theme.barTrack} overflow-hidden">
                              <div class="h-full rounded-full ${idx === 0 ? theme.barFill : 'bg-slate-300'}" style="width: ${Math.max(entry.percentage, 5)}%"></div>
                            </div>
                          </div>
                        `
                        )
                        .join('')}
                    </div>
                  </div>
                  <p class="text-sm sm:text-[15px] text-slate-600 leading-relaxed pt-4 border-t ${theme.divider}">
                    두 번째로 높게 나온 직무의 역량을 함께 챙기면, 팀 프로젝트나 인턴십에서 협업 폭이 훨씬 넓어져요.
                  </p>
                </section>
              </div>

              <section class="rounded-3xl bg-white border ${theme.heroBorder} shadow-md shadow-slate-900/5 p-6 sm:p-8">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-6">
                  <h2 class="text-xl font-bold text-slate-900">함께 일하면 시너지가 좋은 직무 유형 2가지</h2>
                  <span class="text-sm font-medium text-slate-500">조별과제 · 팀 프로젝트 추천 조합</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                  ${primaryRole.synergies
                    .map((syn, idx) => {
                      const partner = ROLE_RESULTS[syn.type];
                      return `
                        <div class="flex flex-col sm:flex-row items-start gap-4 sm:gap-5 pt-5 md:pt-0 ${
                          idx === 1 ? `border-t md:border-t-0 md:border-l ${theme.divider} md:pl-6` : ''
                        }">
                          <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden shrink-0 border ${partner.theme.heroBorder} ${partner.theme.illustrationBg}">
                            ${getIllustrationSvg(partner.type)}
                          </div>
                          <div class="min-w-0 flex-1 space-y-1.5">
                            <p class="text-sm font-bold ${partner.theme.accentText}">${syn.tag}</p>
                            <div class="flex flex-wrap items-baseline gap-x-2">
                              <h3 class="text-lg sm:text-xl font-bold text-slate-900">${partner.name}</h3>
                              <span class="text-sm font-medium text-slate-500">· ${partner.nickname}</span>
                            </div>
                            <p class="text-[15px] sm:text-base text-slate-600 leading-relaxed">${syn.reason}</p>
                          </div>
                        </div>
                      `;
                    })
                    .join('')}
                </div>
              </section>
            </div>
          </div>
        `;

        document.getElementById('result-restart-btn').addEventListener('click', resetToStart);

        const shareBtn = document.getElementById('share-copy-btn');
        shareBtn.addEventListener('click', async () => {
          const shareText = `[나에게 맞는 직무 유형 테스트]\n나의 직무 유형: ${primaryRole.name}\n"${primaryRole.nickname}"\n\n${primaryRole.description.join(' ')}\n\n추천 자격증·과목:\n${primaryRole.preparations
            .map((item, idx) => `${idx + 1}. ${item.title} (${item.category})`)
            .join('\n')}`;

          let copied = false;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(shareText);
              copied = true;
            }
          } catch {}

          if (!copied) {
            const ta = document.createElement('textarea');
            ta.value = shareText;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
              copied = document.execCommand('copy');
            } catch {}
            document.body.removeChild(ta);
          }

          if (copied) {
            shareBtn.textContent = '클립보드에 복사되었어요!';
            setTimeout(() => {
              shareBtn.textContent = '공유하기';
            }, 2400);
          }
        });

        const downloadBtn = document.getElementById('download-png-btn');
        downloadBtn.addEventListener('click', async () => {
          const captureEl = document.getElementById('capture-area');
          if (!captureEl || !window.htmlToImage) return;

          downloadBtn.disabled = true;
          downloadBtn.textContent = '이미지 만드는 중...';
          try {
            if (document.fonts && document.fonts.ready) {
              await document.fonts.ready;
            }
            const dataUrl = await window.htmlToImage.toPng(captureEl, {
              pixelRatio: 2,
              backgroundColor: theme.captureBg,
              filter: (node) =>
                !(node instanceof HTMLElement && node.dataset && node.dataset.captureIgnore === 'true'),
            });
            const link = document.createElement('a');
            link.download = `직무유형테스트_${primaryRole.shortName}.png`;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            downloadBtn.textContent = 'PNG로 저장했어요!';
          } catch {
            downloadBtn.textContent = '다시 저장 시도';
          } finally {
            downloadBtn.disabled = false;
            setTimeout(() => {
              downloadBtn.textContent = 'PNG 이미지 저장';
            }, 2400);
          }
        });
      }

      function render() {
        if (state.phase === 'start') {
          wrapperEl.className = 'min-h-dvh flex flex-col text-slate-900 transition-colors duration-500';
          headerResetBtn.classList.add('hidden');
          headerResetBtn.classList.remove('inline-flex');
          renderStartScreen();
        } else if (state.phase === 'quiz') {
          wrapperEl.className = 'min-h-dvh flex flex-col text-slate-900 transition-colors duration-500';
          headerResetBtn.classList.remove('hidden');
          headerResetBtn.classList.add('inline-flex');
          headerResetLabel.textContent = '처음으로';
          renderQuizScreen();
        } else {
          headerResetBtn.classList.remove('hidden');
          headerResetBtn.classList.add('inline-flex');
          headerResetLabel.textContent = '다시하기';
          renderResultScreen();
        }
      }

      render();
    </script>
  </body>
</html>
